name: MoE
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10

  - pytorch=2.0
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - mkl<2024  # mkl>=2024 from conda-forge breaks pytorch=2.0's libtorch_cpu.so (undefined symbol: iJIT_NotifyEvent)

  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - pillow
  - tqdm
  - pyyaml

  - opencv
  - scikit-image
  - scikit-learn
  - simpleitk
  - pip

  - pip:
    # MedSAM repo dependency (not always fully conda-available)
    - segment-anything

    # HuggingFace stack used in notebook
    - transformers>=4.35,<4.45
    - datasets
    
    - accelerate